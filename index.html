<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f5f2"><title>IronCoach · Valencia 70.3</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh}header{padding:28px 20px 10px;display:flex;justify-content:space-between}.brand{font-weight:900;letter-spacing:-.04em}.race{font-size:10px;color:#777}main{padding:12px 16px 100px}.k{font-size:10px;font-weight:800;letter-spacing:.14em;color:#777;text-transform:uppercase}.title{font-size:32px;line-height:1.02;font-weight:900;letter-spacing:-.05em;margin:8px 4px 20px}.card{background:#fff;border:1px solid #e8e8e3;border-radius:22px;padding:18px;margin:12px 0}.score{font-size:64px;font-weight:900;letter-spacing:-.07em}.h{font-size:21px;font-weight:800}.muted{color:#737373;font-size:14px;line-height:1.45}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.btn{width:100%;border:0;border-radius:14px;background:#171717;color:white;padding:14px;font-weight:800;margin-top:14px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:repeat(5,1fr);padding:10px 8px calc(10px + env(safe-area-inset-bottom));background:#fffffff5;backdrop-filter:blur(16px);border-top:1px solid #ddd}.nav button{border:0;background:none;padding:9px 2px;border-radius:11px;color:#777}.nav .on{background:#171717;color:#fff;font-weight:800}.input{width:100%;padding:13px;border:1px solid #ddd;border-radius:13px;margin:5px 0}.chat{background:#fff;border-radius:22px;border:1px solid #e8e8e3;overflow:hidden}.msgs{height:390px;padding:14px;overflow:auto}.bubble{max-width:85%;padding:11px 13px;border-radius:17px;margin:8px 0;font-size:14px;line-height:1.4}.ai{background:#f0f0ec}.me{background:#171717;color:white;margin-left:auto}.compose{display:flex;gap:7px;padding:10px;border-top:1px solid #eee}.compose input{flex:1}.compose button{width:45px;border:0;border-radius:12px;background:#171717;color:white}</style></head><body><div id="root"></div><script>const K='ic2';let d=JSON.parse(localStorage.getItem(K)||'null')||{name:'',on:false,tab:'Hoy',rpes:[]};function save(){localStorage.setItem(K,JSON.stringify(d))}function auth(){root.innerHTML='<div class="app" style="padding:40px 20px"><div class="k">IRONCOACH</div><div class="title">Tu entrenador para Valencia.</div><div class="card"><div class="h">Empieza tu demo</div><input id="n" class="input" placeholder="Nombre"><input id="e" class="input" placeholder="Email"><button class="btn" onclick="start()">Entrar →</button></div></div>'}function start(){d.name=document.getElementById('n').value||'Atleta';d.on=true;save();render()}function st(){return{r:76+Math.min(10,d.rpes.length*2),rec:82,fat:38,fit:61,con:d.rpes.length?74:55,conf:34}}function today(){let s=st();return '<div class="k">HOY</div><div class="title">Buenas sensaciones primero.</div><div class="card"><div class="k">READINESS</div><div class="score">'+s.r+'</div><div class="muted">Puedes entrenar. Mantén el objetivo y no persigas fatiga.</div></div><div class="card"><div class="k">SESIÓN DE HOY</div><div class="h">Salida larga + brick</div><div class="muted">🚴 Bike 120\' + 🏃 Run 15\' · Z2</div><button class="btn" onclick="log()">Registrar sesión</button></div><div class="card"><div class="k">ESTADO</div>'+row('Recovery',s.rec)+row('Fatigue',s.fat)+row('Fitness',s.fit)+row('Consistency',s.con)+row('Load / Recovery Risk',22)+'</div>'}function row(a,b){return '<div class="row"><span>'+a+'</span><b>'+b+'</b></div>'}function plan(){let ws=[['Lun','Swim','Técnica + aeróbico','45\''],['Mar','Bike','Sweet Spot','60\''],['Mié','Run','Rodaje fácil','45\''],['Jue','Strength','Fuerza + core','40\''],['Vie','Swim','Umbral técnico','50\''],['Sáb','Bike','Salida larga + brick','135\''],['Dom','Run','Tirada larga','70\'']];return '<div class="k">PLAN · BASE 1</div><div class="title">Camino a Valencia.</div><div class="card"><div class="h">IRONMAN 70.3 Valencia</div><div class="muted">18 abril 2027 · consistencia antes que sufrimiento.</div></div><div class="card">'+ws.map(x=>row(x[0]+' · '+x[1]+'<br><small>'+x[2]+'</small>',x[3])).join('')+'</div>'}function progress(){let s=st();return '<div class="k">PROGRESO</div><div class="title">Estás construyendo base.</div>'+[['Fitness',s.fit],['Recovery',s.rec],['Readiness',s.r],['Consistency',s.con],['Finish confidence',s.conf]].map(x=>'<div class="card"><div class="k">'+x[0]+'</div><div class="score">'+x[1]+'</div></div>').join('')}function coach(){return '<div class="k">COACH</div><div class="title">Pregunta lo que quieras.</div><div class="chat"><div id="msgs" class="msgs"><div class="bubble ai">Soy tu IronCoach. Te explico el plan, la carga y por qué adaptamos las sesiones.</div></div><div class="compose"><input id="q" class="input" placeholder="¿Por qué esta sesión?"><button onclick="send()">→</button></div></div>'}function profile(){return '<div class="k">PERFIL</div><div class="title">'+d.name+'.</div><div class="card"><div class="h">Valencia 70.3 · 2027</div>'+row('Objetivo','Buenas sensaciones')+row('Strava','Preparado')+row('Garmin','Preparado')+row('Apple Health','Preparado')+'</div>'}function send(){let q=document.getElementById('q'),v=q.value.trim();if(!v)return;let m=document.getElementById('msgs');m.innerHTML+='<div class="bubble me">'+v+'</div><div class="bubble ai">La decisión combina carga, recuperación, objetivo de carrera y tu limiter. La seguridad está por encima de completar volumen.</div>';q.value='';m.scrollTop=m.scrollHeight}function log(){let r=prompt('RPE de la sesión (1–10)','5');if(r){d.rpes.push(+r);save();render()}}function nav(){return '<nav class="nav">'+['Hoy','Plan','Progreso','Coach','Perfil'].map(x=>'<button class="'+(d.tab==x?'on':'')+'" onclick="go(\''+x+'\')">'+x+'</button>').join('')+'</nav>'}function go(x){d.tab=x;save();render()}function render(){if(!d.on)return auth();let b=d.tab==='Hoy'?today():d.tab==='Plan'?plan():d.tab==='Progreso'?progress():d.tab==='Coach'?coach():profile();root.innerHTML='<div class="app"><header><div class="brand">IRONCOACH</div><div class="race">70.3 VALENCIA · 2027</div></header><main>'+b+'</main>'+nav()+'</div>'}render()</script></body></html>
